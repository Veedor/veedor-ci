name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Verify Action bundle is up to date
        run: |
          git diff --exit-code dist/action || {
            echo "::error::El bundle del Action está desactualizado — corre npm run build y comitea dist/action antes de hacer push."
            exit 1
          }

      - run: npm test
      - run: npm run typecheck
