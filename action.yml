name: 'Veedor CI'
description: 'Find the tests wasting your CI minutes — and see the bill they generate.'
author: 'Veedor'

branding:
  icon: 'dollar-sign'
  color: 'green'

inputs:
  github-token:
    description: >-
      GitHub token used to authenticate API requests. Defaults to the
      GITHUB_TOKEN environment variable if not set.
    required: false
  workflow:
    description: 'Limit the scan to a single workflow (file name or ID). Defaults to scanning all workflows.'
    required: false
  limit:
    description: 'Number of workflow runs to inspect.'
    required: false
    default: '200'
  format:
    description: 'Output format for the workflow log: table, json, or markdown.'
    required: false
    default: 'table'
  retry-window:
    description: >-
      Time window in minutes (max 240) for detecting "likely flaky"
      push-to-retry patterns: a job fails on one commit and passes on the
      next commit pushed to the same branch, by the same author, within
      this window.
    required: false
    default: '60'
  comment-on-pr:
    description: >-
      If true and the run was triggered by a pull_request (or
      pull_request_target) event, publish the markdown report as a PR
      comment, editing the previous report comment instead of duplicating
      it.
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/action/index.cjs'
